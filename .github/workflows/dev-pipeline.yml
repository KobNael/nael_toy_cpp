# Workflow for C++ project
name: dev-pipeline

# Only for dev
on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "feature/*", "dev", "main" ]

# List of actions
jobs:
  # Review
  claude-review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: "--allowedTools 'Read,Bash(git*),Bash(cat*),Bash(find*),Bash(grep*),Bash(gh*)'"
          prompt: |
            You are an expert C++20 developer with deep knowledge in operational research,
            supply chain optimization, and scheduling algorithms.
            Review this pull request for correctness, potential bugs, and code quality.
            Focus on C++ best practices, memory safety, API design, algorithm complexity,
            and optimal data structures for scheduling/OR problems.
            Post your findings as inline PR comments on the relevant lines.
          use_sticky_comment: true
          show_full_output: true
  # Call pipeline
  cpp_pipeline:
    # Skip draft PR
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: KobNael/nael_cpp_action/.github/workflows/cpp-workflow.yml@dev
    with:
      WITH_COVERAGE: true
      RUN_SONAR: true
      CHECK_QUALITY_GATE: true
      UPLOAD_ARTIFACT: true
    secrets:
      GH_PAT: "${{ secrets.GH_PAT }}"
      SONAR_TOKEN: "${{ secrets.SONAR_TOKEN }}"
      SONAR_HOST_URL: "${{ secrets.SONAR_HOST_URL }}"
